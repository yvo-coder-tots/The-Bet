<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Bet</title>

<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Schoolbell&display=swap" rel="stylesheet">

<style>
:root{
  --yellow:#ffcc00;
  --black:#111;
  --blue:#87ceeb;
  --paper:#fef9e7;
  --night:#0b192c;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:"Patrick Hand",cursive;
  color:var(--black);
  background:var(--blue);
  user-select:none;
  transition:background 1.2s ease;
}

button{
  font-family:"Schoolbell","Patrick Hand",cursive;
}

.hidden{
  display:none!important;
}

.fade{
  animation:fade .8s ease;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(15px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}


#youtubePlayer{
  position:fixed;
  width:1px;
  height:1px;
  left:-10px;
  bottom:-10px;
  opacity:0;
  pointer-events:none;
}

#musicBar{
  position:fixed;
  z-index:100;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:min(92%,430px);
  height:48px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:6px 14px;
  background:rgba(255,255,255,.94);
  border:2px solid var(--black);
  border-radius:30px;
  box-shadow:3px 3px 0 rgba(0,0,0,.8);
}

.music-icon{
  width:32px;
  height:32px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--yellow);
  border:2px solid var(--black);
  border-radius:50%;
  font-size:17px;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.08);
  }
}

.music-info{
  min-width:0;
  overflow:hidden;
}

.music-label{
  display:block;
  font-family:Arial,sans-serif;
  font-size:8px;
  font-weight:bold;
  letter-spacing:1px;
  color:#888;
  text-transform:uppercase;
}

#trackTitle{
  display:block;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:16px;
}


#phase1{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding-bottom:65px;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 20% 20%,
      rgba(255,255,255,.35) 0 3px,
      transparent 4px
    ),
    radial-gradient(
      circle at 80% 30%,
      rgba(255,255,255,.3) 0 4px,
      transparent 5px
    ),
    var(--blue);
}

.cloud{
  position:absolute;
  background:#fff;
  border:3px solid var(--black);
  border-radius:50px;
  opacity:.65;
  animation:cloudMove linear infinite;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:#fff;
  border:3px solid var(--black);
  border-radius:50%;
}

.cloud:before{
  width:45px;
  height:45px;
  left:15px;
  top:-25px;
}

.cloud:after{
  width:35px;
  height:35px;
  right:15px;
  top:-18px;
}

.cloud.one{
  width:110px;
  height:40px;
  top:15%;
  left:-130px;
  animation-duration:28s;
}

.cloud.two{
  width:150px;
  height:50px;
  top:38%;
  left:-180px;
  animation-duration:35s;
  animation-delay:8s;
}

@keyframes cloudMove{
  to{
    transform:translateX(125vw);
  }
}

.intro-content{
  position:relative;
  z-index:5;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  width:min(90vw,600px);
}

.snoopy-frame{
  width:clamp(120px,23vw,195px);
  height:clamp(120px,23vw,195px);
  object-fit:contain;
  background:white;
  border:4px solid var(--black);
  border-radius:50%;
  box-shadow:6px 6px 0 var(--black);
  animation:snoopyFloat 4s ease-in-out infinite;
  margin-bottom:-3px;
}

@keyframes snoopyFloat{
  0%,100%{
    transform:translateY(0) rotate(-1deg);
  }
  50%{
    transform:translateY(-7px) rotate(1deg);
  }
}

.intro-card{
  background:white;
  width:fit-content;
  max-width:90vw;
  padding:clamp(18px,3vw,28px) clamp(25px,5vw,48px);
  text-align:center;
  border:4px solid var(--black);
  border-radius:25px 12px 28px 15px;
  box-shadow:7px 7px 0 var(--black);
}

.intro-card h1{
  margin:0;
  font-family:"Schoolbell","Patrick Hand",cursive;
  font-size:clamp(2.2rem,6vw,4.4rem);
  line-height:1;
  font-weight:400;
}

.intro-button-label{
  position:absolute;
  z-index:10;
  bottom:clamp(15%,17vh,19%);
  left:50%;
  transform:translateX(-50%);
  color:#555;
  font-family:"Schoolbell",cursive;
  font-size:clamp(1rem,2.5vw,1.4rem);
  white-space:nowrap;
  pointer-events:none;
  animation:labelFloat 2.5s ease-in-out infinite;
}

@keyframes labelFloat{
  0%,100%{
    transform:translateX(-50%) translateY(0);
  }
  50%{
    transform:translateX(-50%) translateY(-3px);
  }
}

#chaseBtn{
  position:absolute;
  z-index:20;
  left:50%;
  bottom:8%;
  transform:translateX(-50%);
  padding:clamp(10px,2vw,15px) clamp(25px,5vw,38px);
  font-size:clamp(1.2rem,3vw,1.8rem);
  background:white;
  color:var(--black);
  border:4px solid var(--black);
  border-radius:18px 10px 20px 12px;
  box-shadow:6px 6px 0 var(--black);
  cursor:pointer;
  white-space:nowrap;
}

.decor{
  position:absolute;
  z-index:2;
  opacity:.5;
  pointer-events:none;
  font-size:clamp(20px,3vw,32px);
  animation:decorFloat 5s ease-in-out infinite;
}

.d1{
  top:18%;
  left:10%;
}

.d2{
  top:22%;
  right:10%;
  animation-delay:1s;
}

.d3{
  bottom:28%;
  left:15%;
  animation-delay:.5s;
}

.d4{
  bottom:30%;
  right:15%;
  animation-delay:1.5s;
}

@keyframes decorFloat{
  0%,100%{
    transform:translateY(0) rotate(-3deg);
  }
  50%{
    transform:translateY(-8px) rotate(3deg);
  }
}


#phase2{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px 15px 75px;
  background:var(--paper);
}

.notes{
  width:min(100%,520px);
  height:min(90vh,760px);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:white;
  border:4px solid var(--black);
  border-radius:20px;
  box-shadow:8px 8px 0 var(--black);
}

.notes-header{
  flex:none;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 20px;
  background:var(--yellow);
  border-bottom:4px solid var(--black);
  font-size:22px;
}

.notes-header span:last-child{
  font-size:18px;
}

.zigzag{
  flex:none;
  height:25px;
  background:
    linear-gradient(135deg,var(--yellow) 25%,transparent 25%) -15px 0,
    linear-gradient(225deg,var(--yellow) 25%,transparent 25%) -15px 0,
    linear-gradient(315deg,var(--yellow) 25%,transparent 25%),
    linear-gradient(45deg,var(--yellow) 25%,transparent 25%);
  background-size:30px 30px;
  background-color:var(--black);
  border-bottom:3px solid var(--black);
}

.notes-body{
  flex:1;
  overflow-y:auto;
  padding:25px clamp(20px,5vw,35px) 100px;
  background-color:var(--paper);
  background-image:linear-gradient(#ccc 1px,transparent 1px);
  background-size:100% 40px;
  line-height:40px;
}

.notes-body h2{
  margin:0 0 2px;
  font-family:"Schoolbell",cursive;
  font-size:clamp(2rem,7vw,3rem);
  line-height:1.1;
}

.date{
  margin-bottom:20px;
  color:#999;
  font-family:Arial,sans-serif;
  font-size:11px;
  line-height:1.4;
}

#reasonsList{
  margin:0;
  padding:0;
  list-style:none;
  font-size:clamp(1.15rem,3vw,1.45rem);
}

#reasonsList li{
  display:flex;
  gap:12px;
  margin-bottom:5px;
  line-height:1.35;
}

.reason-number{
  min-width:28px;
  text-align:right;
  color:#777;
  font-weight:bold;
}

.next-area{
  position:absolute;
  bottom:25px;
  left:0;
  width:100%;
  display:flex;
  justify-content:center;
}

.next-btn{
  padding:11px 25px;
  background:var(--yellow);
  border:4px solid var(--black);
  border-radius:16px;
  box-shadow:5px 5px 0 var(--black);
  font-size:clamp(1.1rem,3vw,1.4rem);
  cursor:pointer;
}

.next-btn:active{
  transform:translate(4px,4px);
  box-shadow:1px 1px 0 var(--black);
}



#phase3{
  position:absolute;
  inset:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 20px 75px;
  background:var(--night);
  overflow:hidden;
}

.stars{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.star{
  position:absolute;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  animation:twinkle 3s ease-in-out infinite;
}

@keyframes twinkle{
  0%,100%{
    opacity:.2;
    transform:scale(.7);
  }
  50%{
    opacity:1;
    transform:scale(1.4);
  }
}

.moon{
  position:absolute;
  top:8%;
  right:9%;
  width:clamp(55px,10vw,90px);
  height:clamp(55px,10vw,90px);
  background:#fff4c4;
  border:4px solid var(--black);
  border-radius:50%;
  box-shadow:inset -10px -8px 0 rgba(0,0,0,.08);
}

.poem-card{
  position:relative;
  z-index:5;
  width:min(92%,650px);
  max-height:75vh;
  overflow:auto;
  padding:clamp(25px,5vw,50px);
  background:rgba(0,0,0,.35);
  border:3px solid white;
  border-radius:22px;
  box-shadow:7px 7px 0 rgba(255,255,255,.2);
  color:white;
}

#poemContainer{
  font-size:clamp(1.25rem,3.5vw,2rem);
  line-height:1.65;
  text-align:left;
  white-space:normal;
}

.cursor{
  display:inline-block;
  width:3px;
  height:1.2em;
  margin-left:3px;
  background:white;
  vertical-align:middle;
  animation:blink 1s step-end infinite;
}

@keyframes blink{
  50%{
    opacity:0;
  }
}

.snoopy-bottom{
  position:absolute;
  z-index:4;
  bottom:65px;
  left:50%;
  transform:translateX(-50%);
  width:clamp(100px,18vw,150px);
}

.snoopy-bottom img{
  width:100%;
  object-fit:contain;
}


@media(max-width:600px){

  #phase1{
    padding-bottom:60px;
  }

  .snoopy-frame{
    width:135px;
    height:135px;
    border-width:3px;
    box-shadow:5px 5px 0 var(--black);
  }

  .intro-card{
    border-width:3px;
    box-shadow:5px 5px 0 var(--black);
  }

  .intro-card h1{
    font-size:clamp(2.1rem,10vw,3.3rem);
  }

  #chaseBtn{
    border-width:3px;
    box-shadow:5px 5px 0 var(--black);
  }

  .notes{
    height:calc(100vh - 105px);
    border-width:3px;
  }

  .notes-header{
    padding:12px 15px;
  }

  .notes-body{
    padding-left:18px;
    padding-right:18px;
  }

  .poem-card{
    max-height:72vh;
    padding:25px 20px;
  }
}

@media(max-height:650px){

  .snoopy-frame{
    width:100px;
    height:100px;
  }

  .intro-card{
    padding:14px 20px;
  }

  .intro-card h1{
    font-size:2.3rem;
  }

  #chaseBtn{
    bottom:7%;
  }

  .intro-button-label{
    bottom:15%;
  }
}
</style>
</head>

  {
    title:"Can't Help Falling In Love · Elvis Presley",
    id:"LJRA8UrlqCM"
  },

  {
    title:"Malay Ko · Daniel Padilla",
    id:"4zYL2AmwC8g"

];


let player;
let songIndex = 0;
let musicStarted = false;
let youtubeReady = false;

function onYouTubeIframeAPIReady(){

  player = new YT.Player(
    "youtubePlayer",
    {

      height:"1",
      width:"1",

      videoId:
        playlist[0].id,

      playerVars:{
        autoplay:0,
        controls:0,
        disablekb:1,
        fs:0,
        modestbranding:1,
        playsinline:1,
        rel:0
      },

      events:{
        onReady:onPlayerReady,
        onStateChange:onPlayerStateChange
      }

    }
  );

}


function onPlayerReady(){

  youtubeReady = true;

}


function startMusic(){

  if(musicStarted){
    return;
  }

  if(!youtubeReady || !player){
    return;
  }

  musicStarted = true;

  playCurrentSong();

}


function playCurrentSong(){

  if(!player){
    return;
  }

  const song =
    playlist[songIndex];

  trackTitle.textContent =
    song.title;

  player.loadVideoById(
    song.id
  );

  player.setVolume(45);

}


function onPlayerStateChange(event){

  /*
     YT.PlayerState.ENDED = 0
  */

  if(
    event.data ===
    YT.PlayerState.ENDED
  ){

    songIndex++;

    if(
      songIndex >=
      playlist.length
    ){

      songIndex = 0;

    }

    playCurrentSong();

  }

}

document.addEventListener(
  "click",
  startMusic,
  {once:true}
);

document.addEventListener(
  "touchstart",
  startMusic,
  {
    once:true,
    passive:true
  }
);

const chaseBtn =

    "chaseBtn"

let jumps = 0;

const maxJumps = 6;


function moveButton(e){

  if(
    e.type ===
    "touchstart"
  ){

    e.preventDefault();

  }

  startMusic();


  if(
    jumps < maxJumps
  ){

    const buttonWidth =
      chaseBtn.offsetWidth;

    const buttonHeight =
      chaseBtn.offsetHeight;


    const maxX =
      window.innerWidth -
      buttonWidth -
      25;


    const maxY =
      window.innerHeight -
      buttonHeight -
      105;


    const x =
      Math.max(
        15,
        Math.random() *
        maxX
      );


    const y =
      Math.max(
        15,
        Math.random() *
        maxY
      );


    chaseBtn.style.position =
      "fixed";

    chaseBtn.style.left =
      x + "px";

    chaseBtn.style.top =
      y + "px";

    chaseBtn.style.bottom =
      "auto";


    const rotation =
      (Math.random() - .5) *
      25;


    chaseBtn.style.transform =
      `rotate(${rotation}deg)`;


    jumps++;


  }else{

    chaseBtn.textContent =
      "Okay... you got me! 🐾";


    chaseBtn.style.background =
      "#ffcc00";


    chaseBtn.style.transform =
      "rotate(0deg)";


    chaseBtn.removeEventListener(
      "mouseover",
      moveButton
    );


    chaseBtn.removeEventListener(
      "touchstart",
      moveButton
    );


    chaseBtn.addEventListener(
      "click",
      goToPhase2
    );


    jumps++;

  }

}


chaseBtn.addEventListener(

);


chaseBtn.addEventListener(

const phase1 =
  document.getElementById(
    "phase1"
  );

const phase2 =
  document.getElementById(
    "phase2"
  );

const phase3 =
  document.getElementById(
    "phase3"
  );


function goToPhase2(){

  phase1.classList.add(
    "hidden"
  );

  phase2.classList.remove(
    "hidden"
  );

  phase2.classList.add(
    "fade"
  );

  document.body.style.background =
    "var(--paper)";

}


function goToPhase3(){

  phase2.classList.add(
    "hidden"
  );

  phase3.classList.remove(
    "hidden"
  );

  phase3.classList.add(
    "fade"
  );

  document.body.style.background =
    "var(--night)";


  generateStars();


  setTimeout(
    startTypewriter,
    700
  );

}

function generateStars(){

  const container =
    document.getElementById(
      "stars"
    );


  container.innerHTML = "";


  for(
    let i = 0;
    i < 55;
    i++
  ){

    const star =
      document.createElement(
        "div"
      );


    star.className =
      "star";


    const size =
      Math.random() * 3 + 1;


    star.style.width =
      size + "px";


    star.style.height =
      size + "px";


    star.style.left =
      Math.random() * 100 + "%";


    star.style.top =
      Math.random() * 100 + "%";


    star.style.animationDelay =
      Math.random() * 3 + "s";


    container.appendChild(
      star
    );

  }

}

Sencerely,
Yvo`;


const poemContainer =
  document.getElementById(
    "poemContainer"
  );

const cursor =
  document.getElementById(
    "cursor"
  );


let poemIndex = 0;


function startTypewriter(){

  poemContainer.innerHTML =
    "";

  poemIndex = 0;

  typeNextCharacter();

}


function typeNextCharacter(){

  if(
    poemIndex >=
    poem.length
  ){

    cursor.style.display =
      "inline-block";

    return;

  }


  const character =
    poem.charAt(
      poemIndex
    );


  if(
    character === "\n"
  ){

    poemContainer.innerHTML +=
      "<br>";

  }else{

    poemContainer.innerHTML +=
      character;

  }


  poemIndex++;


  const speed =
    Math.random() * 70 + 35;


  setTimeout(
    typeNextCharacter,
    speed
  );

}
